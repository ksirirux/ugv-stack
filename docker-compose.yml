#version: '3.8'

services:
  server:
    container_name: ugv-server
    build:
      context: ./server
    ports:
      - "8087:8087"
    environment:
      - VISION_API_URL=http://vision-backend:8007
      
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - vision-backend
      - mongodb

  web:
    container_name: ugv-frontend
    build:
      context: ./ugv-frontend
    ports:
      - "5177:5177"
    environment:
      - BACKEND_URL=http://server:8087
    volumes:
      - ./ugv-frontend:/app
      - /app/node_modules
    depends_on:
      - server

  vision-backend:
    container_name: ugv-vision-backend
    build:
      context: ./ugv_vision_backend_orchard
    ports:
      - "8007:8007"

  mongodb:
    image: mongo:latest
    container_name: ugv-mongodb
    command: ["mongod", "--auth", "--bind_ip_all"]
    restart: always
    ports:
      - "27027:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=ugv_admin
      - MONGO_INITDB_ROOT_PASSWORD=Tonkla0709
    volumes:
      - /data/docker/ugv/mongodb:/data/db

